<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Înregistrare</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/register_style.css">
</head>

<body>
    <main class="page">
        <section class="card">
            <h1>Înregistrează-te</h1>

            <form class="register-form" action="login.html" method="post" enctype="multipart/form-data">
                <div class="row">
                    <label for="username">Nume utilizator</label>
                    <input type="text" id="username" name="username" placeholder="ex: maria92" required>
                </div>

                <div class="row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="ex: nume@exemplu.com" required>
                </div>

                <div class="row two-col">
                    <div>
                        <label for="password">Parolă</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div>
                        <label for="confirm_password">Confirmă parola</label>
                        <input type="password" id="confirm_password" name="confirm_password" required>
                    </div>
                </div>

                <div class="row two-col">
                    <div>
                        <label for="dob">Data nașterii </label>
                        <input type="date" id="dob" name="dob" required>
                    </div>
                    <div>
                        <label for="country">Țara</label>
                        <select id="country" name="country" required>
              <option value="" disabled selected>Selectează țara</option>
              <option value="RO">România</option>
              <option value="MD">Republica Moldova</option>
              <option value="OTHER">Altă țară</option>
            </select>
                    </div>
                </div>

                <div class="row">
                    <label>Gen</label>
                    <div class="radio-group">
                        <input type="radio" id="femeie" name="gender" value="female">
                        <label for="femeie">Femeie</label>

                        <input type="radio" id="barbat" name="gender" value="male">
                        <label for="barbat">Bărbat</label>

                        <input type="radio" id="altul" name="gender" value="other">
                        <label for="altul">Altul</label>
                    </div>
                </div>

                <div class="row">
                    <label for="account_type">Tip cont</label>
                    <select id="account_type" name="account_type" required>
            <option value="" disabled selected>Selectează</option>
            <option value="student">Student</option>
            <option value="profesor">Profesor</option>
            <option value="vizitator">Vizitator</option>
          </select>
                </div>

                <div class="row">
                    <label>Interese</label>
                    <div class="checkbox-grid">
                        <label><input type="checkbox" name="interests" value="frontend"> Frontend</label>
                        <label><input type="checkbox" name="interests" value="backend"> Backend</label>
                        <label><input type="checkbox" name="interests" value="uxui"> UX/UI</label>
                        <label><input type="checkbox" name="interests" value="js"> JavaScript</label>
                        <label><input type="checkbox" name="interests" value="python"> Python Web</label>
                        <label><input type="checkbox" name="interests" value="wp"> WordPress</label>
                        <label><input type="checkbox" name="interests" value="django"> Django</label>
                    </div>
                </div>

                <div class="row">
                    <label for="avatar">Încarcă avatar</label>
                    <input type="file" id="avatar" name="avatar" accept="image/*">
                </div>

                <div class="row">
                    <label for="bio">Scurtă descriere</label>
                    <textarea id="bio" name="bio" rows="3" placeholder="Scrie câteva cuvinte despre tine..."></textarea>
                </div>

                <div class="actions">
                    <button type="submit" class="btn primary">Creează cont</button>
                    <button type="reset" class="btn ghost">Resetează</button>
                </div>

                <p class="login-link">
                    Ai deja cont? <a href="login.html">Mergi la login</a>
                </p>
            </form>
        </section>
    </main>
</body>

</html>
