{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="{% static 'CSS/style.css' %}">
  <link rel="stylesheet" href="{% static 'CSS/login.css' %}">
</head>
<body>
  <div class="login-container">
    <div class="login-image">
      <img src="{% static 'media/INFO_Asset-6-1024x513.png' %}" alt="Imagine login">
    </div>
    <div class="separator"></div>
    <div class="login-form">
      <h2>Login</h2>
      <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Parola" required>
        <button type="submit">Login</button>
      </form>
      <p class="register-text">
        Nu ai cont? <a href="{% url 'register' %}">Înregistrează-te</a>
      </p>
    </div>
  </div>
  <script src="{% static 'js/login_js.js' %}"></script>
</body>
</html>
